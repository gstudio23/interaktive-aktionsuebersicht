name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get files
        uses: actions/checkout@v6
      - name: Refresh actions from GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -n "$GITLAB_TOKEN" ]; then
            python3 scripts/update.py
          else
            echo "Using the saved action list."
          fi
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html aktion.html style.css script.js aktion.js _site/
          cp -R assets data _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
